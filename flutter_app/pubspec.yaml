name: boston_tracker_flutter
description: Boston Tracker - Professional Delivery Tracking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP Client
  dio: ^5.4.0
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^12.1.1
  
  # Location & Maps
  geolocator: ^11.1.0
  # google_maps_flutter: ^2.5.0  # TODO: Re-add after build is stable
  
  # Socket.io
  socket_io_client: ^2.0.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Background Services
  flutter_foreground_task: ^8.15.0
  
  # UI Components
  # flutter_map: ^6.1.0  # TODO: Re-add after fixing Kotlin
  # latlong2: ^0.9.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  
  # Notifications
  flutter_local_notifications: ^17.2.4
  url_launcher: ^6.3.0
  
  # Utils
  intl: ^0.19.0
  logger: ^2.0.2
  connectivity_plus: ^5.0.2
  package_info_plus: ^9.0.1
  device_info_plus: ^9.1.2
  battery_plus: ^5.0.3
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Icons
  cupertino_icons: ^1.0.2
  flutter_vector_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
